server.servlet.context-path=/api
spring.application.name=website-api
spring.flyway.enabled=false
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/${DB_NAME:gamuxdb}}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.data.web.pageable.max-page-size=500

gamux.image.base-url=${IMG_API_URL}
gamux.image.base-api-key=${IMG_API_KEY}
file.upload-dir=/app/uploads/images

api.security.token.secret=${JWT_SECRET:my-secret-key}
api.init.admin.username=${INITIAL_ADMIN_USERNAME}
api.init.admin.password=${INITIAL_ADMIN_PASSWORD}
api.init.admin.email=${INITIAL_ADMIN_EMAIL}